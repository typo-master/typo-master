# TypoAgent Configuration File
# This is a sample configuration file for TypoAgent

# GitHub API Configuration
github:
  token: ${GITHUB_TOKEN}  # Set via environment variable GITHUB_TOKEN
  api_url: https://api.github.com
  timeout: 30
  max_retries: 3
  rate_limit_delay: 1.0

# LLM API Configuration (OpenAI compatible)
llm:
  enabled: false
  base_url: ${OPENAI_BASE_URL}  # e.g. https://api.openai.com or compatible gateway
  model: ${OPENAI_MODEL}        # e.g. gpt-5.4
  # DO NOT hardcode real api_key here. Prefer environment variable OPENAI_API_KEY.
  api_key: ${OPENAI_API_KEY}
  timeout: 30
  max_output_tokens: 300

# Spell Check Configuration
spell:
  enabled: true
  min_confidence: 0.7
  max_corrections_per_file: 50
  filter_web3_terms: true
  filter_code_identifiers: true

# Pull Request Configuration
pr:
  auto_create: false
  min_typos_for_pr: 1
  min_stars_for_pr: 50
  min_activity_score: 30
  validate_before_create: true
  include_detailed_description: true

# System Configuration
system:
  log_level: INFO
  log_file: ./logs/typo_agent.log
  state_dir: ./state
  cache_dir: ./cache
  temp_dir: ./temp
  max_concurrent_tasks: 10
  task_timeout: 3600.0
  enable_metrics: true
  enable_tracing: false

# Scanner Configuration
scanner:
  max_files_to_scan: null  # null means no limit
  supported_extensions:
    - .md
    - .txt
    - .rst
    - .adoc
    - .py
    - .js
    - .ts
    - .jsx
    - .tsx
    - .sol
    - .rs
    - .go
  skip_directories:
    - .git
    - .github
    - node_modules
    - __pycache__
    - .venv
    - venv
    - env
    - dist
    - build
    - .idea
    - .vscode

# Logging Configuration
logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file_path: ./logs/typo_agent.log
  max_file_size: 10485760  # 10MB
  backup_count: 5

# Permissions Configuration
permissions:
  global_remote_enabled: false  # 总开关：关闭时所有远程/高风险操作被拒绝

  git_clone: false
  git_fetch: false
  git_pull: false
  git_push: false
  git_checkout: true
  git_create_branch: true
  git_add: true
  git_commit: true

  github_read: true
  pr_create: false
  pr_update: false
  pr_comment: false
  pr_merge: false
  pr_close: false
  issue_create: false
  issue_comment: false
  issue_close: false

  fs_read: true
  fs_write: false
  fs_delete: false

  shell_run: false
  run_tests: false
  install_deps: false

  web_fetch: false
  api_call: false
  llm_request: true

# Custom Configuration
custom:
  # Add your custom configuration here
  # Example:
  # custom_key: custom_value
