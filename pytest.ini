[pytest]
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (requires external services)
    regression: Regression tests (API contract stability)
    security: Security tests (vulnerability scanning)
    critical: Critical tests (must pass)
    slow: Slow tests (skip in quick runs)
    database: Tests requiring database
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning
